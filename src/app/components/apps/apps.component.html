<section id="apps" class="text-center my-5">
  <h2 class="mb-5">Nos Applications</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let app of apps">
      <div class="card h-100 p-3 shadow-sm">
        <i [class]="app.icon + ' fs-1 mb-3 text-warning'"></i>
        <h5>{{ app.name }}</h5>
        <p>{{ app.description }}</p>
      </div>
    </div>
  </div>
</section>
