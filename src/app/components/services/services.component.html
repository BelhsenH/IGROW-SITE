<section id="services" class="container my-5 text-center">
  <h2 class="mb-5">Nos Services</h2>
  <div class="row g-4">
    <div class="col-md-3" *ngFor="let service of services">
      <div class="card h-100 p-4 shadow-sm">
        <i [class]="service.icon + ' fs-1 mb-3'"></i>
        <h5>{{ service.title }}</h5>
        <p>{{ service.description }}</p>
      </div>
    </div>
  </div>
</section>
